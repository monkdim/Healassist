name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Both the plugin zip and the repository manifest are published as release assets, so
# GitHub's /releases/latest/download/ redirect always serves the newest build. Nothing
# has to be committed back to the repo when a version changes.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        shell: pwsh
        run: |
          $hooks = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $hooks | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $hooks -Force

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Generate repository manifest
        shell: pwsh
        run: |
          $manifest = Get-Content HealAssist/HealAssist.json -Raw | ConvertFrom-Json
          $csproj = [xml](Get-Content HealAssist/HealAssist.csproj)
          $version = @($csproj.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $version) { throw "No <Version> found in HealAssist.csproj" }

          # Always points at the newest release's assets, so the manifest never goes stale.
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"

          $entry = [ordered]@{
            Author              = $manifest.Author
            Name                = $manifest.Name
            Punchline           = $manifest.Punchline
            Description         = $manifest.Description
            Changelog           = ""
            InternalName        = $manifest.InternalName
            AssemblyVersion     = $version
            RepoUrl             = $manifest.RepoUrl
            ApplicableVersion   = "any"
            Tags                = $manifest.Tags
            CategoryTags        = $manifest.CategoryTags
            DalamudApiLevel     = $manifest.DalamudApiLevel
            IconUrl             = ""
            DownloadLinkInstall = "$base/latest.zip"
            DownloadLinkTesting = "$base/latest.zip"
            DownloadLinkUpdate  = "$base/latest.zip"
            IsHide              = $false
            IsTestingExclusive  = $false
            DownloadCount       = 0
            LastUpdate          = [string][DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          }

          ConvertTo-Json -InputObject @($entry) -Depth 5 -AsArray | Set-Content repo.json -Encoding utf8
          Write-Host "Manifest for $($manifest.Name) $version"
          Get-Content repo.json

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:VERSION"
          $zip = "HealAssist/bin/Release/HealAssist/latest.zip"
          if (-not (Test-Path $zip)) { throw "Packager did not produce $zip" }

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Updating existing release $tag"
            gh release upload $tag $zip repo.json --clobber
          } else {
            Write-Host "Creating release $tag"
            $notes = "Install through Dalamud by adding this custom plugin repository:`n`n" +
                     "``https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/repo.json``"
            gh release create $tag $zip repo.json --target $env:GITHUB_SHA --title "HealAssist $env:VERSION" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
